name: Kitty releases

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preparation only, GitHub drafts, or public releases
        type: choice
        options: [dry-run, draft, publish]
        default: dry-run
      kind:
        description: Component to release
        type: choice
        options: [both, frontend, backend]
        default: both
  push:
    branches: [main, 'release-automation-*']
    paths:
      - '.github/workflows/releases.yml'
      - '.github/release-request.json'
      - 'tools/release.py'
      - 'tests/test-releases.py'
      - 'docs/releases/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: kitty-releases
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.packages.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Regression and release safeguards
        run: |
          bash test.sh
          node tests/test-backend-bootstrap.js
          python tests/test-backend-packaging.py
          python tests/test-releases.py
      - name: Check existing backend download links
        run: python tests/check-backend-downloads.py
      - name: Mozilla validator
        run: npx --yes web-ext@10.6.0 lint --source-dir extension --output json > amo-lint.json
      - name: Verify tested sources and prepare archives
        id: packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: python tools/release.py prepare --output release-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kitty-release-packages
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: kitty-release-amo-lint
          path: amo-lint.json
          if-no-files-found: warn

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kitty-release-packages
          path: release-dist
      - name: Upload, verify SHA-256, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        run: python tools/release.py publish --output release-dist
