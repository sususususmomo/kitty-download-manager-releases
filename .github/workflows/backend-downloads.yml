name: Kitty publication checks
on:
  workflow_dispatch:
  push:
    branches:
      - 'frontend-test-*'
    paths:
      - '.github/workflows/backend-downloads.yml'
      - 'tests/check-backend-downloads.py'
      - 'tests/backend-download-checksums.json'
      - 'extension/**'
jobs:
  popup-render:
    name: Firefox — rendu identique et textes sûrs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: frontend-v8.37
          path: .kitty-render-baseline
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/kitty-render-tools" playwright@1.62.1 pngjs@7.0.0
          node "$RUNNER_TEMP/kitty-render-tools/node_modules/playwright/cli.js" install --with-deps firefox
      - name: Compare v8.37 and current popup and test image mode in Gecko
        run: NODE_PATH="$RUNNER_TEMP/kitty-render-tools/node_modules" node tests/test-popup-render.js .kitty-render-baseline/extension artifacts/popup-render
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kitty-firefox-render-comparison
          path: artifacts/popup-render/
          if-no-files-found: warn
          retention-days: 14
  public-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tests/check-backend-downloads.py
      - name: Real yt-dlp image-only integration and background controls
        run: |
          python -m pip install 'yt-dlp[default]'
          python tests/test-image-download.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node tests/test-image-mode.js
      - name: Mozilla add-on validator
        run: npx --yes web-ext@10.6.0 lint --source-dir extension --output json > amo-lint.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kitty-amo-lint
          path: amo-lint.json
          if-no-files-found: warn
