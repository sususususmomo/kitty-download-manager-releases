name: Kitty publication checks
on:
  workflow_dispatch:
  push:
    branches:
      - 'frontend-test-*'
    paths:
      - '.github/workflows/backend-downloads.yml'
      - 'tests/check-backend-downloads.py'
      - 'tests/backend-download-checksums.json'
jobs:
  public-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tests/check-backend-downloads.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Mozilla add-on validator
        run: npx --yes web-ext@10.6.0 lint --source-dir extension --output json > amo-lint.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kitty-amo-lint
          path: amo-lint.json
          if-no-files-found: warn
